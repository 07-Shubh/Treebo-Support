apiVersion: apps/v1
kind: Deployment
metadata:
  name: flutter-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flutter-web-app
  template:
    metadata:
      labels:
        app: flutter-web-app
    spec:
      containers:
        - name: flutter-web-app
          image: flutter-web-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: flutter-web-service
spec:
  type: NodePort
  selector:
    app: flutter-web-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007
