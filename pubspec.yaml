name: treebo_self_checkin
description: Treebo Hotels Self Check-in App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  image_picker: ^1.0.7
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.10+1
  camera: ^0.10.5
  path_provider: ^2.1.1
  path: ^1.8.3
  intl: ^0.18.1
  flutter_signature_pad: ^3.0.1
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  test: ^1.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  
  # Enable Material 3
  generate: true
